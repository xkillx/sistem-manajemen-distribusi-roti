version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "int64"
          - db_type: "pg_catalog.int8"
            go_type: "int64"
          - db_type: "pg_catalog.int4"
            go_type: "int32"
